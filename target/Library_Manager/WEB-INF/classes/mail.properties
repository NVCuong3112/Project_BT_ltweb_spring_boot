# Cấu hình máy chủ gửi thư điện tử (SMTP)
# Hướng dẫn dành cho Gmail:
# 1. Bật xác thực 2 bước (2-Step Verification) trong tài khoản Google.
# 2. Tạo Mật khẩu ứng dụng (App Password) tại: https://myaccount.google.com/apppasswords
# 3. Điền email của bạn vào mail.user và mật khẩu ứng dụng 16 ký tự vào mail.password.

mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.smtp.ssl.protocols=TLSv1.2

# Email người gửi và Mật khẩu ứng dụng (App Password)
mail.user=your_email@gmail.com
mail.password=your_app_password
mail.from=your_email@gmail.com
mail.from.name=Library Manager
